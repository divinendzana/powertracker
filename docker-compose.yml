version: '3.8'

services:
  db:
    image: postgres:13
    container_name: powertracker_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7-alpine
    container_name: powertracker_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: